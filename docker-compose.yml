services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stat-pg-db
    command: ["postgres", "-c", "shared_preload_libraries=stat_pg", "-c", "stat_pg.workers=4", "-c", "max_worker_processes=16"]
    mem_limit: 64g
    environment:
      POSTGRES_PASSWORD: postgres
      USER: postgres
    ports:
      - "5433:5432"       # Map Postgres server to host 5433 to avoid conflicts
      - "8125:8125/udp"   # Map UDP ingestion port for stats
    volumes:
      - .:/workspace
      # Persist cargo registry registry to avoid redownloading crates on rebuilds
      - cargo-cache:/root/.cargo/registry
    restart: unless-stopped

  bench:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stat-pg-bench
    volumes:
      - .:/workspace
      - cargo-cache:/root/.cargo/registry
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - db

volumes:
  cargo-cache:
